name: Build VideoGrab APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build clean APK
        run: |
          set -euo pipefail
          rm -rf app/build
          gradle --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK structure and package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.mokal147.videograb'" apk-badging.txt
          grep -q "application-label:'VideoGrab'" apk-badging.txt
          unzip -t "$APK"
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p verified
          cp "$APK" verified/VideoGrab-debug.apk
          sha256sum verified/VideoGrab-debug.apk | tee verified/SHA256SUMS.txt
          cp apk-badging.txt verified/

      - name: Upload verified APK and report
        uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-verified-${{ github.run_number }}
          path: verified/
          if-no-files-found: error
